name: Upload E2E test results
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI/CD']
    types:
      - completed

jobs:
  e2e-tests-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Annotate with triggering workflow run
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.display_title }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ -n "$RUN_URL" ]; then
            echo "::notice title=Triggered by workflow run::$RUN_NAME ($RUN_CONCLUSION): $RUN_URL"
          else
            echo "::notice title=Triggered manually::No triggering workflow run (event: ${{ github.event_name }})"
          fi
      - name: Download blob reports from GitHub Actions Artifacts
        id: download_artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          path: all-blob-reports
          pattern: test-results-blob-playwright.*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
      - name: Download Vitest browser tests report from GitHub Actions Artifacts
        id: download_vitest_artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          path: vitest-report
          pattern: test-results-vitest-browser
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check if there are any reports to merge
        id: reports_check
        run: |
          if [ -z "$(ls -A ${{ steps.download_artifact.outputs.download-path }} 2>/dev/null)" ]; then
            echo "playwright=false" >> $GITHUB_OUTPUT
          else
            echo "playwright=true" >> $GITHUB_OUTPUT
            echo "reports=true" >> $GITHUB_OUTPUT
          fi
          if [ -z "$(ls -A ${{ steps.download_vitest_artifact.outputs.download-path }} 2>/dev/null)" ]; then
            echo "vitest=false" >> $GITHUB_OUTPUT
          else
            echo "vitest=true" >> $GITHUB_OUTPUT
            echo "reports=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/upload-artifact@v4
        if: steps.reports_check.outputs.playwright == 'true'
        with:
          name: test-results-blob-report
          path: ./all-blob-reports
      - name: Merge into HTML Report
        if: steps.reports_check.outputs.playwright == 'true'
        # The e2e and Storybook suites use different testDirs, so a common one is forced for the merge
        run: |
          echo "export default { testDir: 'tests' };" > merge.config.mjs
          npx playwright merge-reports -c merge.config.mjs --reporter html ./all-blob-reports
      - name: Copy resources # for some reason, the resources are not copied automatically
        if: steps.reports_check.outputs.playwright == 'true'
        run: cp -r ./all-blob-reports/resources ./playwright-report/resources
      # Vitest blobs can't be merged by Playwright, so its own HTML report is deployed under /vitest
      - name: Add Vitest browser tests report
        if: steps.reports_check.outputs.vitest == 'true'
        run: |
          mkdir -p ./playwright-report
          cp -r ./vitest-report ./playwright-report/vitest
          if [ ! -f ./playwright-report/index.html ]; then
            echo '<meta http-equiv="refresh" content="0; url=vitest/">' > ./playwright-report/index.html
          fi
      - uses: actions/upload-artifact@v4
        if: steps.reports_check.outputs.reports == 'true'
        with:
          name: test-results-html-report
          path: ./playwright-report

      - name: Remove page screenshots from trace ZIP files
        if: steps.reports_check.outputs.reports == 'true'
        run: |
          # Fail fast on errors, undefined variables, and pipeline failures.
          set -euo pipefail

          while IFS= read -r -d '' zip_file; do
            mapfile -t matching_entries < <(zipinfo -1 "$zip_file" | grep --extended-regexp '(^|.*/)page@.*\.jpe?g$' || true)

            if [ "${#matching_entries[@]}" -gt 0 ]; then
              echo "Removing ${#matching_entries[@]} page screenshots from $zip_file"
              zip -d "$zip_file" "${matching_entries[@]}" >/dev/null
            fi
          done < <(find ./playwright-report -type f -name '*.zip' -size +25M -print0)

      - name: Remove files larger than 25MB (limit of Cloudflare Pages)
        if: steps.reports_check.outputs.reports == 'true'
        run: |
          find ./playwright-report -type f -size +25M
          find ./playwright-report -type f -size +25M -delete
      - name: Upload merged report
        if: steps.reports_check.outputs.reports == 'true'
        id: deploy-report
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy playwright-report --project-name=allkaraoke-party-tests-results --branch=${{ github.event.workflow_run.id }}
      - uses: actions/github-script@v8
        if: steps.reports_check.outputs.reports == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-report.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy-report.outputs.deployment-alias-url }}
          HAS_PLAYWRIGHT_REPORT: ${{ steps.reports_check.outputs.playwright }}
          HAS_VITEST_REPORT: ${{ steps.reports_check.outputs.vitest }}
        with:
          script: |
            core.summary.addRaw(`
            # Deploying with Cloudflare Pages
            | Name                    | Result |
            | ----------------------- | - |
            | **Preview URL**:        | ${process.env.DEPLOYMENT_URL} |
            | **Branch Preview URL**: | ${process.env.DEPLOYMENT_ALIAS_URL} |
            | **Playwright report**:  | ${process.env.HAS_PLAYWRIGHT_REPORT === 'true' ? process.env.DEPLOYMENT_URL : '-'} |
            | **Vitest browser report**: | ${process.env.HAS_VITEST_REPORT === 'true' ? `${process.env.DEPLOYMENT_URL}/vitest/` : '-'} |
            `
            ).write();
