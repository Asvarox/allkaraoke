name: Fork PR preview instructions

# Tells the maintainer how to deploy a fork PR's preview with fork-preview.yml, for its latest commit.
# `_target` because fork PRs only get a read-only token otherwise. Safe because the PR's code is never
# checked out: the checkout below is the base branch, for the comment action.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions: {}

jobs:
  comment:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: './.github/templates/fork-preview-comment'
        with:
          pr: ${{ github.event.pull_request.number }}
          body: |
            **Preview not deployed** - fork PRs get no secrets in CI.

            Maintainers: review the changes (including `wrangler.jsonc`, `vite.config.mts` and `package.json`), then deploy ${{ github.event.pull_request.head.sha }} with

            ```bash
            gh workflow run fork-preview.yml -f pr=${{ github.event.pull_request.number }} -f sha=${{ github.event.pull_request.head.sha }}
            ```

            or from [Actions > Fork PR preview](${{ github.server_url }}/${{ github.repository }}/actions/workflows/fork-preview.yml).
