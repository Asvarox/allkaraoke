name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - parallel:
          - name: Format check
            run: pnpm format-check
          - name: Lint
            run: pnpm lint
          - name: Type check
            run: pnpm type-check
          - name: Test
            run: pnpm test
          - name: Build Storybook
            run: pnpm build-storybook
          - name: Knip
            run: pnpm knip
      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static # deployed by deploy-storybook / deploy-storybook-branch
          path: storybook-static
          retention-days: 1
  e2e-tests-run:
    strategy:
      fail-fast: false
      matrix:
        browser: ['chromium']
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    runs-on: ubuntu-latest
    env:
      VITE_APP_POSTHOG_KEY: ${{ secrets.VITE_APP_POSTHOG_KEY }}
    container:
      image: docker://mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: './.github/templates/setup-node'
      # Must run before the build: the preview server that serves the E2E suite reads the
      # .dev.vars the build copies into build/allkaraoke_party/, not the one in the repo root.
      - name: Configure local worker secrets for E2E
        # The Realtime app credentials are stripped rather than merely absent from the example:
        # the E2E build supplies its own, pointing at the fake SFU (see the build step below).
        run: |
          cp .dev.vars.example .dev.vars
          sed -i '/^REALTIME_APP_/d' .dev.vars
      - name: Build app
        # Points the Worker at the fake SFU that playwright.config.ts starts (tests/fake-sfu), so
        # P2P rooms run on the SFU data plane. This build is only ever served to the suite — the
        # deploy job builds its own, without it.
        run: pnpm build
        env:
          E2E_FAKE_SFU_URL: http://127.0.0.1:3480/v1
      - name: Run E2E tests
        uses: './.github/templates/run-playwright'
        with:
          project: '${{ matrix.browser }}'
          config: 'playwright.config.ts'
          shard: '${{ matrix.shardIndex }}'
          shardTotal: '${{ matrix.shardTotal }}'
          grepInvert: '@visual'
  # Both suites' blob reports are merged into one HTML report by upload-e2e-test-results.yml
  e2e-tests-add-summary:
    runs-on: ubuntu-latest
    if: always() # needs to run on success too, to clean up a stale failure comment from a previous run
    needs: ['e2e-tests-run', 'visual-regression-tests-run', 'browser-tests-run']
    permissions:
      pull-requests: write # allows commenting on a PR
    steps:
      - name: Write job summary
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@v8
        with:
          script: |
            core.summary.addRaw(`
            # E2E tests reports
            | Name          | Result |
            | ----------------------- | - |
            | **E2E tests**: | ${{ needs.e2e-tests-run.result }} |
            | **Visual regression tests**: | ${{ needs.visual-regression-tests-run.result }} |
            | **Browser tests**: | ${{ needs.browser-tests-run.result }} |
            | **URL**: | 	https://${{ github.run_id }}.allkaraoke-party-tests-results.pages.dev |
            `
            ).write();
      # A single comment (identified by a hidden marker) is kept: any prior one is deleted and
      # replaced with a fresh comment (not edited in place) so the PR author gets a
      # notification, and removed entirely once tests are green again.
      - name: Replace or remove PR comment about E2E failures
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          E2E_RESULT: ${{ needs.e2e-tests-run.result }}
          VISUAL_RESULT: ${{ needs.visual-regression-tests-run.result }}
          BROWSER_RESULT: ${{ needs.browser-tests-run.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- e2e-test-summary -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            const results = {
              'E2E tests': process.env.E2E_RESULT,
              'Visual regression tests': process.env.VISUAL_RESULT,
              'Browser tests': process.env.BROWSER_RESULT,
            };
            const failedSuites = Object.keys(results).filter((suite) => results[suite] === 'failure');

            if (Object.values(results).every((result) => result === 'success')) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            if (failedSuites.length === 0) {
              return; // skipped/cancelled: leave any existing comment as-is, nothing new to report
            }

            const reportUrl = `https://${context.runId}.allkaraoke-party-tests-results.pages.dev`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `## ❌ ${failedSuites.join(', ')} failed\n\n- [Test report](${reportUrl})\n- [Workflow run](${runUrl})\n\n${marker}`;

            if (existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  browser-tests-run:
    container:
      image: docker://mcr.microsoft.com/playwright:v1.63.0-jammy
    runs-on: ubuntu-latest
    env:
      # The HTML report (written to .vitest) is published next to the Playwright one by upload-e2e-test-results.yml
      VITEST_REPORTERS: --reporter=default --reporter=html
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - name: Run browser tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: pnpm test:browser --run $VITEST_REPORTERS
      - name: Reset snapshot baseline to target branch
        if: github.ref != 'refs/heads/master'
        uses: './.github/templates/reset-snapshot-baseline'
        with:
          snapshotDir: '__snapshots__' # per the browser project's resolveScreenshotPath in vite.config.mts
          snapshotSuffix: '-ci.png' # per the browser project's resolveScreenshotPath in vite.config.mts
      - name: Run browser tests and update snapshots
        if: github.ref != 'refs/heads/master'
        run: pnpm test:browser --run --update $VITEST_REPORTERS
      - name: Upload changed snapshots
        if: github.ref != 'refs/heads/master'
        uses: './.github/templates/upload-changed-snapshots'
        with:
          name: 'changed-snapshots-browser-1' # when sharding, suffix with the shard index
          snapshotDir: '__snapshots__'
          snapshotSuffix: '-ci.png'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-tests-attachments
          include-hidden-files: true
          path: |
            .vitest/attachments
            **/__screenshots__
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-vitest-browser
          include-hidden-files: true # Vitest 5's HTML reporter writes to .vitest, ignoring --outputFile
          path: .vitest

  visual-regression-tests-run:
    if: github.ref != 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    container:
      image: docker://mcr.microsoft.com/playwright:v1.63.0-jammy
    runs-on: ubuntu-latest
    env:
      VITE_APP_POSTHOG_KEY: ${{ secrets.VITE_APP_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: './.github/templates/setup-node'
      # Must run before the build: the preview server that serves the E2E suite reads the
      # .dev.vars the build copies into build/allkaraoke_party/, not the one in the repo root.
      - name: Configure local worker secrets for E2E
        # The Realtime app credentials are stripped rather than merely absent from the example:
        # the build below supplies its own, pointing at the fake SFU.
        run: |
          cp .dev.vars.example .dev.vars
          sed -i '/^REALTIME_APP_/d' .dev.vars
      - name: Build app
        # Same fake SFU as the e2e job — the online visual specs open a real P2P room, so this build
        # must reach the same data plane rather than falling back to the relay.
        run: |
          git config --global --add safe.directory /__w/allkaraoke/allkaraoke
          pnpm build
        env:
          E2E_FAKE_SFU_URL: http://127.0.0.1:3480/v1
      - name: Run visual regression tests and update snapshots
        uses: './.github/templates/run-playwright'
        with:
          config: 'playwright.config.ts'
          shard: '${{ matrix.shardIndex }}'
          shardTotal: '${{ matrix.shardTotal }}'
          grep: '@visual'
          artifactSuffix: '-visual' # e2e-tests-run uploads the same config/project/shard names
          updateSnapshots: 'true'
          # Not all of playwright.config.ts's testDir: tests/storybook holds the storybook-screenshots-run job's snapshots
          snapshotDir: 'tests/visual-regression'
          snapshotSuffix: '-linux.png' # this job always renders in the Linux Playwright container
      - name: Upload changed snapshots
        uses: './.github/templates/upload-changed-snapshots'
        with:
          name: 'changed-snapshots-visual-regression-${{ matrix.shardIndex }}'
          snapshotDir: 'tests/visual-regression'
          snapshotSuffix: '-linux.png'

  # Screenshots every Storybook story, see tests/storybook/stories.spec.ts
  storybook-screenshots-run:
    if: github.ref != 'refs/heads/master'
    container:
      image: docker://mcr.microsoft.com/playwright:v1.63.0-jammy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Screenshot stories and update snapshots
        uses: './.github/templates/run-playwright'
        with:
          config: 'playwright.storybook.config.ts'
          updateSnapshots: 'true'
          snapshotDir: 'tests/storybook' # per playwright.storybook.config.ts's snapshotPathTemplate
          snapshotSuffix: '-linux.png'
      - name: Upload changed snapshots
        uses: './.github/templates/upload-changed-snapshots'
        with:
          name: 'changed-snapshots-storybook-1' # when sharding, suffix with the shard index
          snapshotDir: 'tests/storybook'
          snapshotSuffix: '-linux.png'

  # Collects the snapshots every test job (and shard) changed, commits them to the PR branch in one
  # go and posts a single PR comment linking to an old / new / diff gallery of all of them.
  commit-snapshots:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: ['browser-tests-run', 'visual-regression-tests-run', 'storybook-screenshots-run']
    permissions:
      contents: write # https://github.com/stefanzweifel/git-auto-commit-action?tab=readme-ov-file#usage
      pull-requests: write # allows commenting on a PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - name: Download changed snapshots
        uses: actions/download-artifact@v5
        with:
          pattern: changed-snapshots-*
          merge-multiple: true
          path: ${{ runner.temp }}/changed-snapshots
      - name: Fetch target branch for visual diff baseline
        run: git fetch --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      # Diffs against the target branch rather than the PR branch, so the gallery always shows the
      # full change - not just what changed since a previous run auto-committed snapshots here.
      - name: Build visual diff gallery
        id: visual-diff
        run: pnpm visual-diff:report --snapshots "${{ runner.temp }}/changed-snapshots" --base "origin/${{ github.base_ref }}"
      - name: Apply changed snapshots
        run: |
          if [ -d "${{ runner.temp }}/changed-snapshots" ]; then
            cp -R "${{ runner.temp }}/changed-snapshots/." .
          fi
      - name: Auto commit updated snapshots
        id: auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '[ci-skip][skip-release-notes] chore: update visual regression snapshots'
          commit_options: '--no-verify'
          file_pattern: '*.png'
      - name: Upload visual diff gallery to Cloudflare Pages
        id: deploy-visual-diff
        if: steps.visual-diff.outputs.has_report == 'true'
        continue-on-error: true # a hosting hiccup shouldn't block the review comment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy test-results/visual-diff-report --project-name=allkaraoke-party-tests-results --branch=visual-diff-${{ github.run_id }}
      - name: Render visual diff comment
        if: steps.visual-diff.outputs.has_report == 'true'
        env:
          BASE_URL: ${{ steps.deploy-visual-diff.outputs.deployment-alias-url }}
        run: pnpm visual-diff:comment
      # A single comment (identified by a hidden marker) is kept: any prior one is deleted and
      # replaced with a fresh comment (not edited in place) so the PR author gets a notification,
      # and removed entirely once the snapshots match the target branch again. When a test job
      # failed its snapshots are missing here, so an existing comment is left as-is instead.
      - name: Replace or remove visual diff comment
        uses: actions/github-script@v8
        env:
          HAS_REPORT: ${{ steps.visual-diff.outputs.has_report }}
          ALL_TESTS_PASSED: ${{ !contains(needs.*.result, 'failure') }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Prefix match also cleans up the per-job comments (`:ct`, `:vr`) posted before the jobs were merged
            const markerPrefix = '<!-- visual-diff-thumbnails';
            const marker = `${markerPrefix} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.filter((comment) => comment.body?.includes(markerPrefix));

            if (process.env.HAS_REPORT !== 'true' && process.env.ALL_TESTS_PASSED !== 'true') {
              return;
            }

            for (const comment of existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
            }

            if (process.env.HAS_REPORT !== 'true') {
              return;
            }

            const fs = require('node:fs');
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            let galleryLink = '';
            try {
              galleryLink = fs.readFileSync('test-results/visual-diff-report/comment.md', 'utf8');
            } catch {}

            const body = `Changes detected in visual regression snapshots. Please review.\n\n[View the run that committed the updated snapshots](${runUrl})${galleryLink}\n\n${marker}`;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: ['e2e-tests-run', 'browser-tests-run', 'quick-checks']
    environment:
      name: production
      url: https://allkaraoke.party/
    env:
      VITE_APP_POSTHOG_KEY: ${{ secrets.VITE_APP_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 200 # needed for release-note commit range collection
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - run: npx playwright install chromium
        timeout-minutes: 3
      - run: pnpm build
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The folder the action should deploy.
      - name: Upload to Cloudflare
        id: deploy-report
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Add Deployment PostHog Annotation
        uses: actions/github-script@v8
        env:
          POSTHOG_PAT_KEY: ${{ secrets.POSTHOG_PAT_KEY }}
        with:
          github-token: ${{ secrets.GH_PAT_REPOS_WORKFLOW }}
          script: |
            const { execFileSync } = require('node:child_process');

            const previousSuccessfulRun = (
              await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci-improvement.yml',
                branch: 'master',
                event: 'push',
                status: 'completed',
                per_page: 100,
              })
            ).find((run) => run.id !== context.runId && run.conclusion === 'success');

            const releaseNotesJson = execFileSync(
              'node',
              [
                'scripts/cicd/get-release-note-commits.mjs',
                ...(previousSuccessfulRun?.head_sha ? [previousSuccessfulRun.head_sha] : []),
                context.sha,
              ],
              { encoding: 'utf8' },
            );
            const { messages: includedSubjects } = JSON.parse(releaseNotesJson);

            if (includedSubjects.length === 0) {
              core.notice(
                `Skipping PostHog release annotation. No release-note commits found between ${previousSuccessfulRun?.head_sha ?? 'repository start'} and ${context.sha}.`,
              );
              return;
            }

            const deployUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // PostHog rejects annotation content longer than 8192 chars - keep as many subjects as fit
            const maxContentLength = 8192;
            const lines = [`[Deployment](${deployUrl})`];
            let contentLength = lines[0].length;
            for (const [index, subject] of includedSubjects.entries()) {
              const line = `- ${subject}`;
              const remaining = includedSubjects.length - index - 1;
              const overflowLineLength = remaining > 0 ? `\n- …and ${remaining} more`.length : 0;
              if (contentLength + 1 + line.length + overflowLineLength > maxContentLength) {
                lines.push(`- …and ${includedSubjects.length - index} more`);
                break;
              }
              lines.push(line);
              contentLength += 1 + line.length;
            }
            const content = lines.join('\n');
            const response = await fetch('https://eu.posthog.com/api/projects/281/annotations/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${process.env.POSTHOG_PAT_KEY}`,
              },
              body: JSON.stringify({
                content,
                date_marker: new Date().toISOString(),
                scope: 'project',
                creation_type: 'GIT',
              }),
            });

            if (!response.ok) {
              throw new Error(`PostHog annotation failed with status ${response.status}: ${await response.text()}`);
            }

            core.info(
              `Annotated PostHog with ${includedSubjects.length} commit message(s) from ${previousSuccessfulRun?.head_sha ?? 'repository start'}..${context.sha}.`,
            );
      - name: 'Start monitoring'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT_REPOS_WORKFLOW }}
          script: |
            github.rest.actions.updateRepoVariable({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'MONITORING_ATTEMPTS',
            value: '4'
            });
              github.rest.actions.enableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'monitor-posthog-events.yml',
            });

  deploy-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: prs
      url: ${{ steps.deploy-report.outputs.deployment-url }}
    env:
      VITE_APP_POSTHOG_KEY: ${{ secrets.VITE_APP_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - run: npx playwright install chromium
        timeout-minutes: 3
      - name: Build app
        # Selects `env.pr` in wrangler.jsonc: the Cloudflare Vite plugin bakes the environment into the
        # generated config at build time, so `wrangler deploy --env` cannot pick it afterwards
        run: CLOUDFLARE_ENV=pr pnpm build
        shell: bash
      - name: Upload to Cloudflare
        id: deploy-report
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # One worker per PR, redeployed on every push. cleanup-pr-worker.yml deletes it when the PR closes
          command: deploy --name=allkaraoke-party-pr-${{ github.event.pull_request.number }}

  deploy-storybook:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: ['quick-checks']
    environment:
      name: storybook
      url: https://storybook.allkaraoke.party/
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - name: Download Storybook build
        uses: actions/download-artifact@v5
        with:
          name: storybook-static
          path: storybook-static
      - name: Upload to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.storybook.jsonc

  deploy-storybook-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: ['quick-checks']
    environment:
      name: storybook-prs
      url: ${{ steps.deploy-storybook.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: './.github/templates/setup-node'
      - name: Download Storybook build
        uses: actions/download-artifact@v5
        with:
          name: storybook-static
          path: storybook-static
      - name: Upload to Cloudflare
        id: deploy-storybook
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # One worker per PR, redeployed on every push. cleanup-pr-worker.yml deletes it when the PR closes
          command: deploy --config=wrangler.storybook.jsonc --name=allkaraoke-storybook-pr-${{ github.event.pull_request.number }}
