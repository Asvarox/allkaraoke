# See https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

name: fork-preview-comment
description: >-
  Posts the fork preview comment on a PR, deleting the previous one first so the PR keeps at most one
  and the latest is always at the bottom. Needs `pull-requests: write`, and callers should share the
  `fork-preview-comment-<pr>` concurrency group so two runs never replace it at once.

inputs:
  pr:
    required: true
    description: PR number
  body:
    required: true
    description: Comment body (Markdown)

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
        BODY: ${{ inputs.body }}
      run: |
        marker='<!-- fork-preview -->'
        gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" || true # already deleted
          done
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$marker
        $BODY"
